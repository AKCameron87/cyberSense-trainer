<div class="min-h-screen bg-cyber-dark flex items-center justify-center px-4 page-enter">

  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-lg bg-cyber-accent flex items-center justify-center text-cyber-dark font-bold text-xl">
          CS
        </div>
        <h1 class="text-2xl font-bold tracking-widest text-white">CYBERSENSE</h1>
      </div>
      <p class="text-cyber-muted text-sm">Security Awareness Training</p>
    </div>

    <!-- Card -->
    <div class="card">
      <h2 class="text-xl font-bold text-white mb-6">
        {{ mode() === 'login' ? 'Sign In' : 'Create Account' }}
      </h2>

      <!-- Google Sign In -->
      <button (click)="signInWithGoogle()"
              [disabled]="loading"
              class="w-full flex items-center justify-center gap-3 bg-white text-gray-800 font-semibold py-3 px-4 rounded-lg hover:bg-gray-100 transition-colors mb-4">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>

      <div class="flex items-center gap-3 my-4">
        <div class="flex-1 h-px bg-cyber-border"></div>
        <span class="text-cyber-muted text-xs">or</span>
        <div class="flex-1 h-px bg-cyber-border"></div>
      </div>

      <!-- Display name (register only) -->
      <div *ngIf="mode() === 'register'" class="mb-4">
        <label class="block text-xs text-cyber-muted uppercase tracking-wider mb-2">Display Name</label>
        <input
          [(ngModel)]="displayName"
          type="text"
          placeholder="Your name"
          class="w-full bg-cyber-darker border border-cyber-border rounded-lg px-4 py-3 text-white placeholder-cyber-muted focus:outline-none focus:border-cyber-accent transition-colors">
      </div>

      <!-- Email -->
      <div class="mb-4">
        <label class="block text-xs text-cyber-muted uppercase tracking-wider mb-2">Email</label>
        <input
          [(ngModel)]="email"
          type="email"
          placeholder="you@example.com"
          class="w-full bg-cyber-darker border border-cyber-border rounded-lg px-4 py-3 text-white placeholder-cyber-muted focus:outline-none focus:border-cyber-accent transition-colors">
      </div>

      <!-- Password -->
      <div class="mb-6">
        <label class="block text-xs text-cyber-muted uppercase tracking-wider mb-2">Password</label>

        <!-- Input with show/hide toggle -->
        <div class="relative">
          <input
            [(ngModel)]="password"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="••••••••"
            class="w-full bg-cyber-darker border border-cyber-border rounded-lg px-4 py-3 pr-12 text-white placeholder-cyber-muted focus:outline-none focus:border-cyber-accent transition-colors">
          <button type="button"
                  (click)="toggleShowPassword()"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-cyber-muted hover:text-white transition-colors text-base">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>

        <!-- Strength bar + requirements — register mode only -->
        <div *ngIf="mode() === 'register' && password">

          <!-- Strength bar -->
          <div class="h-1.5 bg-cyber-border rounded-full overflow-hidden mt-3">
            <div class="h-full rounded-full transition-all duration-300"
                 [class]="strengthColor"
                 [style.width]="strengthWidth">
            </div>
          </div>

          <!-- Requirements checklist -->
          <div class="mt-2 grid grid-cols-2 gap-x-4 gap-y-1">
            <div *ngFor="let req of passwordRequirements"
                 class="flex items-center gap-1.5 text-xs">
              <span [class]="req.met ? 'text-cyber-green' : 'text-cyber-muted'">
                {{ req.met ? '✓' : '○' }}
              </span>
              <span [class]="req.met ? 'text-cyber-green' : 'text-cyber-muted'">
                {{ req.label }}
              </span>
            </div>
          </div>
        </div>
      </div>

      <!-- Error -->
      <div *ngIf="errorMessage"
           class="mb-4 p-3 rounded-lg bg-cyber-red bg-opacity-10 border border-cyber-red text-cyber-red text-sm">
        {{ errorMessage }}
      </div>

      <!-- Submit -->
      <button
        (click)="mode() === 'login' ? signInWithEmail() : register()"
        [disabled]="loading || (mode() === 'register' && !passwordValid)"
        class="w-full btn-primary py-3 text-base mb-4 transition-opacity"
        [class.opacity-50]="mode() === 'register' && !passwordValid">
        {{ loading ? 'Please wait...' : mode() === 'login' ? 'Sign In' : 'Create Account' }}
      </button>

      <!-- Toggle mode -->
      <p class="text-center text-cyber-muted text-sm">
        {{ mode() === 'login' ? "Don't have an account?" : 'Already have an account?' }}
        <button (click)="toggleMode()" class="text-cyber-accent hover:underline ml-1">
          {{ mode() === 'login' ? 'Sign up' : 'Sign in' }}
        </button>
      </p>
    </div>

    <!-- Skip -->
    <p class="text-center mt-4">
      <a routerLink="/" class="text-cyber-muted text-sm hover:text-white transition-colors">
        Continue without account →
      </a>
    </p>

  </div>
</div>
